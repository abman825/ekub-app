<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    
    <!-- Coin/Shield Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2" />

  <!-- Shield Shape (Security/Trust) -->
  <path d="M256 100 L360 140 V240 C360 310 310 370 256 395 C202 370 152 310 152 240 V140 Z" fill="url(#goldGrad)" filter="url(#dropShadow)" />

  <!-- Inner Vault / Growth Symbol (Equb Savings Icon) -->
  <g transform="translate(0, -5)">
    <!-- Hand/Supporting Base -->
    <path d="M200 310 Q256 330 312 310" stroke="#ffffff" stroke-width="16" stroke-linecap="round" fill="none" />
    
    <!-- Dollar / Growth Arrow in Center -->
    <path d="M256 175 V275 M225 200 C225 185 240 175 256 175 C275 175 285 185 285 200 C285 220 225 230 225 250 C225 265 240 275 256 275 C275 275 287 265 287 250" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Stars (Community / Equb Success) -->
  <path d="M190 160 L194 172 L206 172 L196 180 L200 192 L190 184 L180 192 L184 180 L174 172 L186 172 Z" fill="#ffffff" opacity="0.9" />
  <path d="M322 160 L326 172 L338 172 L328 180 L332 192 L322 184 L312 192 L316 180 L306 172 L318 172 Z" fill="#ffffff" opacity="0.9" />
</svg>